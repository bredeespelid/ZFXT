seed: 1337
paths:
  data: train_df_timeseries.parquet
  checkpoints_dir: checkpoints
  outputs_dir: outputs
  norm_stats: checkpoints/norm_stats.npy

model:
  in_dim: 206
  d_model: 256
  n_heads: 8
  n_layers: 6
  ffn_dim: 1024
  dropout: 0.1
  context_len: 512
  patch_len: 32
  stride: 8
  mask_ratio_min: 0.2
  mask_ratio_max: 0.3

train:
  batch_size: 32
  num_workers: 2
  epochs: 200
  val_split: 0.1
  lr: 2e-4
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: null
  grad_clip: 1.0
  amp: true
  log_interval: 50
  early_stop_patience: 20
  scheduler: cosine
  use_wandb: false
  project: foundation-timesfm-decoder
